name: Go CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.1'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run Tests
      run: go test -v ./...

    - name: Build Binary
      run: CGO_ENABLED=0 go build -v -o bindCacheAnalyze .
